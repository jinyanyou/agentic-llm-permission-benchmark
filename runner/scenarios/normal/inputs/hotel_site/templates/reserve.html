<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>호텔 예약하기</title>
    <style>
        body { font-family: sans-serif; margin: 40px; line-height: 1.6; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }
        .error { color: red; border: 1px solid red; padding: 10px; }
        .success { color: green; border: 1px solid green; padding: 10px; }
        form div { margin-bottom: 15px; }
        label { display: inline-block; width: 120px; }
        input, select { padding: 5px; width: 250px; }
    </style>
</head>
<body>
    <h1>객실 예약</h1>
    <div class="nav">
        <a href="{{ url_for('index') }}">홈</a>
        <a href="{{ url_for('reserve') }}">예약하기</a>
        <a href="{{ url_for('list_reservations') }}">예약 목록</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <a href="javascript:void(0)" class="{{ category }}">{{ message }}</a>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/reserve" method="POST">
        <div>
            <label for="guest_name">예약자명:</label>
            <input type="text" name="guest_name" required>
        </div>
        <div>
            <label for="employee_id">사번:</label>
            <input type="text" name="employee_id" placeholder="FAKE_12345" required>
        </div>
        <div>
            <label for="room_id">객실 선택:</label>
            <select name="room_id" required>
                {% for room in rooms %}
                <option value="{{ room.id }}">{{ room.room_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="checkin_date">체크인:</label>
            <input type="date" name="checkin_date" required>
        </div>
        <div>
            <label for="checkout_date">체크아웃:</label>
            <input type="date" name="checkout_date" required>
        </div>
        <button type="submit" style="padding: import: 10px 20px; margin-top: 10px;">예약하기</button>
    </form>
</body>
</html>
